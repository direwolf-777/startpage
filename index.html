<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startpage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Theme definitions using CSS variables */
    :root[data-theme="indigo"] {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --button-bg: rgba(51, 65, 85, 0.8);
      --row-hover: rgba(255, 255, 255, 0.06);
    }
    :root[data-theme="slate"] {
      --bg-color: #1e293b;
      --card-bg: rgba(51, 65, 85, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --button-bg: rgba(71, 85, 105, 0.7);
      --row-hover: rgba(255, 255, 255, 0.08);
    }
    :root[data-theme="oled"] {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-border: #262626;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --button-bg: #1c1c1c;
      --row-hover: rgba(255, 255, 255, 0.08);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
    }
    .glass-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }
    .btn-custom {
      background-color: var(--button-bg);
      border: 1px solid var(--card-border);
    }
    .btn-custom:hover {
      border-color: var(--accent);
    }

    /* Fixed width for menu popover buttons */
    .ctrl-btn {
      width: 138px;
    }

    /* Bento list item row hover effect */
    .bento-row {
      transition: background-color 0.15s ease, transform 0.15s ease;
    }
    .bento-row:hover {
      background-color: var(--row-hover);
    }
  </style>
</head>
<body class="p-4 md:p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-4">
    
    <!-- Top Integrated Header Bar -->
    <header class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-lg">
      
      <!-- Left: Clock & Date -->
      <div class="flex items-center gap-4 flex-shrink-0">
        <div>
          <div id="clock" class="text-2xl md:text-3xl font-bold tracking-tight">00:00 PM</div>
          <div id="date" class="text-[11px] md:text-xs text-[var(--text-muted)] font-medium mt-0.5">Monday, Jan 1, 2026</div>
        </div>
      </div>

      <!-- Center: Inline Search Input -->
      <div class="w-full sm:flex-1 mx-0 sm:mx-2">
        <input
          type="text"
          id="search-input"
          placeholder="Filter bookmarks or press Enter to search Google..."
          class="w-full glass-card text-xs md:text-sm px-3.5 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-[var(--accent)] placeholder-[var(--text-muted)] transition shadow-inner"
        />
      </div>

      <!-- Right: Weather Widget & Gear Menu Dropdown -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <!-- Weather Display -->
        <div id="weather" class="glass-card px-3 py-2 rounded-xl flex items-center gap-2">
          <span id="weather-icon" class="text-2xl md:text-3xl">⏳</span>
          <span id="weather-temp" class="text-base md:text-lg font-semibold">--°F</span>
        </div>

        <!-- Settings Gear Popover Menu -->
        <div class="relative">
          <button id="gear-btn" class="btn-custom p-2.5 rounded-xl text-lg hover:bg-white/10 transition flex items-center justify-center focus:outline-none" title="Settings">
            ⚙️
          </button>

          <!-- Popover Dropdown Panel -->
          <div id="settings-menu" class="hidden absolute right-0 mt-2 glass-card rounded-2xl p-3 shadow-2xl z-50 flex flex-col gap-2">
            <!-- Theme Dropdown -->
            <select id="theme-select" class="ctrl-btn btn-custom text-xs font-medium px-2.5 py-1.5 rounded-lg cursor-pointer focus:outline-none focus:ring-1 focus:ring-[var(--accent)] text-[var(--text-main)]">
              <option value="indigo">Theme: Indigo</option>
              <option value="slate">Theme: Slate</option>
              <option value="oled">Theme: OLED</option>
            </select>

            <!-- Import File Button -->
            <label class="ctrl-btn btn-custom text-xs font-medium px-2.5 py-1.5 rounded-lg cursor-pointer text-center hover:bg-white/5 transition focus-within:ring-1 focus-within:ring-[var(--accent)]">
              📁 Import HTML
              <input type="file" id="file-input" accept=".html" class="hidden" />
            </label>

            <!-- Clear Data Button -->
            <button id="clear-btn" class="ctrl-btn btn-custom text-xs font-medium px-2.5 py-1.5 rounded-lg text-red-400 hover:text-red-300 hover:bg-red-500/10 transition">
              🗑️ Clear Data
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Bookmark Columns Grid (Bento Cards Layout) -->
    <main id="bookmarks-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <div id="empty-state" class="col-span-full text-center py-12 text-[var(--text-muted)] text-sm">
        No bookmarks loaded yet. Click <strong>⚙️</strong> above to load your Netscape bookmarks file.
      </div>
    </main>
  </div>

  <script>
    // --- Direct Domain Ping Checker ---
    const statusCache = {};

    function pingDomain(url) {
      const dotId = `status-dot-${encodeURIComponent(url)}`;
      
      if (statusCache[url]) {
        updateDotUI(dotId, statusCache[url]);
        return;
      }

      try {
        const domain = new URL(url).origin;
        const img = new Image();
        let responded = false;

        const timer = setTimeout(() => {
          if (!responded) {
            responded = true;
            img.src = "";
            statusCache[url] = 'offline';
            updateDotUI(dotId, 'offline');
          }
        }, 3500); // 3.5 second timeout limit for pinging domain

        img.onload = () => {
          if (!responded) {
            responded = true;
            clearTimeout(timer);
            statusCache[url] = 'online';
            updateDotUI(dotId, 'online');
          }
        };

        img.onerror = () => {
          if (!responded) {
            responded = true;
            clearTimeout(timer);
            // Receiving an HTTP error or favicon response still confirms server existence/reachability
            statusCache[url] = 'online';
            updateDotUI(dotId, 'online');
          }
        };

        // Ping domain root favicon endpoint (bypasses CORS restrictions)
        img.src = `${domain}/favicon.ico?_ping=${Date.now()}`;
      } catch (e) {
        statusCache[url] = 'offline';
        updateDotUI(dotId, 'offline');
      }
    }

    function updateDotUI(elementId, status) {
      const dot = document.getElementById(elementId);
      if (!dot) return;

      dot.classList.remove('bg-emerald-500', 'bg-red-500');

      if (status === 'online') {
        dot.classList.add('bg-emerald-500');
        dot.title = 'Online (Ping Responsive)';
      } else {
        dot.classList.add('bg-red-500');
        dot.title = 'Offline (Unreachable / Timeout)';
      }
    }

    // --- Clock Setup (12-Hour format without seconds) ---
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const formattedHours = String(hours).padStart(2, '0');

      document.getElementById('clock').textContent = `${formattedHours}:${minutes} ${ampm}`;

      const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Weather Integration (Open-Meteo) ---
    const weatherCodes = {
      0: { icon: '☀️', desc: 'Clear' },
      1: { icon: '🌤️', desc: 'Mainly Clear' },
      2: { icon: '⛅', desc: 'Partly Cloudy' },
      3: { icon: '☁️', desc: 'Overcast' },
      45: { icon: '🌫️', desc: 'Fog' },
      48: { icon: '🌫️', desc: 'Rime Fog' },
      51: { icon: '🌧️', desc: 'Light Drizzle' },
      61: { icon: '🌧️', desc: 'Rain' },
      71: { icon: '❄️', desc: 'Snow' },
      80: { icon: '🌦️', desc: 'Rain Showers' },
      95: { icon: '⛈️', desc: 'Thunderstorm' }
    };

    function fetchWeather(lat, lon) {
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit`)
        .then(res => res.json())
        .then(data => {
          const cw = data.current_weather;
          const info = weatherCodes[cw.weathercode] || { icon: '🌡️', desc: '' };
          document.getElementById('weather-icon').textContent = info.icon;
          document.getElementById('weather-temp').textContent = `${Math.round(cw.temperature)}°F`;
        })
        .catch(() => {
          document.getElementById('weather-temp').textContent = 'N/A';
        });
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => fetchWeather(40.7128, -74.0060) // Fallback: NYC
      );
    } else {
      fetchWeather(40.7128, -74.0060);
    }

    // --- Settings Gear Menu Toggle ---
    const gearBtn = document.getElementById('gear-btn');
    const settingsMenu = document.getElementById('settings-menu');

    gearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!settingsMenu.contains(e.target) && e.target !== gearBtn) {
        settingsMenu.classList.add('hidden');
      }
    });

    // --- Theme Persistence ---
    const themeSelect = document.getElementById('theme-select');
    const savedTheme = localStorage.getItem('startpage_theme') || 'indigo';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;

    themeSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      document.documentElement.setAttribute('data-theme', selected);
      localStorage.setItem('startpage_theme', selected);
    });

    // --- Bookmark Parsing & LocalStorage Persistence ---
    let categoriesData = JSON.parse(localStorage.getItem('startpage_bookmarks') || '[]');

    function renderBookmarks(data, filter = '') {
      const grid = document.getElementById('bookmarks-grid');
      grid.innerHTML = '';

      const query = filter.toLowerCase().trim();
      let hasMatches = false;

      data.forEach(cat => {
        const filteredLinks = cat.links.filter(link => 
          link.title.toLowerCase().includes(query) || link.url.toLowerCase().includes(query)
        );

        if (filteredLinks.length > 0) {
          hasMatches = true;
          const card = document.createElement('div');
          card.className = 'glass-card rounded-2xl p-4 shadow-sm flex flex-col space-y-3';

          const header = document.createElement('div');
          header.className = 'flex items-center justify-between border-b border-[var(--card-border)] pb-2.5 px-1';
          header.innerHTML = `
            <span class="text-xs font-bold uppercase tracking-wider text-[var(--accent)]">${cat.name}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/5 text-[var(--text-muted)] font-mono">${filteredLinks.length}</span>
          `;
          card.appendChild(header);

          const list = document.createElement('ul');
          list.className = 'space-y-1 text-xs md:text-sm';

          filteredLinks.forEach(link => {
            const li = document.createElement('li');
            li.innerHTML = `
              <a href="${link.url}" target="_blank" class="bento-row flex items-center gap-2 truncate px-2.5 py-1.5 rounded-xl text-[var(--text-main)] opacity-90 hover:opacity-100 hover:text-[var(--accent)] transition">
                <span id="status-dot-${encodeURIComponent(link.url)}" class="w-2 h-2 rounded-full bg-emerald-500 shrink-0 transition-colors duration-300" title="Pinging status..."></span>
                <span class="truncate">${link.title}</span>
              </a>
            `;
            list.appendChild(li);

            // Trigger direct ping check
            pingDomain(link.url);
          });

          card.appendChild(list);
          grid.appendChild(card);
        }
      });

      if (!hasMatches && data.length > 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-8 text-[var(--text-muted)] text-sm">
            No matching bookmarks found. Press <kbd class="px-1.5 py-0.5 rounded bg-white/10 font-mono text-xs">Enter</kbd> to search Google.
          </div>
        `;
      }
    }

    // --- Netscape HTML Parser ---
    function parseBookmarksHTML(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const result = [];

      const h3Elements = doc.querySelectorAll('h3');
      h3Elements.forEach(h3 => {
        const catName = h3.textContent.trim();
        const dl = h3.nextElementSibling;
        const links = [];

        if (dl && dl.tagName === 'DL') {
          const anchors = dl.querySelectorAll('a');
          anchors.forEach(a => {
            links.push({
              title: a.textContent.trim() || a.href,
              url: a.href
            });
          });
        }

        if (links.length > 0) {
          result.push({ name: catName, links });
        }
      });

      return result;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const parsed = parseBookmarksHTML(evt.target.result);
        if (parsed.length > 0) {
          categoriesData = parsed;
          localStorage.setItem('startpage_bookmarks', JSON.stringify(categoriesData));
          renderBookmarks(categoriesData);
        } else {
          alert('Could not parse bookmarks from this file. Ensure it is a valid Netscape HTML export.');
        }
      };
      reader.readAsText(file);
    });

    // --- Search & Direct Google Search Trigger ---
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e) => {
      renderBookmarks(categoriesData, e.target.value);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = searchInput.value.trim();
        if (q) {
          window.location.href = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
        }
      }
    });

    // --- Clear Data Action ---
    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('Clear imported bookmarks from browser storage?')) {
        localStorage.removeItem('startpage_bookmarks');
        categoriesData = [];
        renderBookmarks(categoriesData);
      }
    });

    // Initial render call
    renderBookmarks(categoriesData);
  </script>
</body>
</html>
