<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        glassborder: 'rgba(255, 255, 255, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-4 pb-2 md:pb-2 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation / Header Bar (~65px height) -->
    <header class="w-full max-w-7xl mx-auto mb-3">
        <div class="bg-slate-900/80 backdrop-blur-md border border-white/10 rounded-2xl px-4 py-[6.5px] flex items-center justify-between shadow-lg">
            
            <!-- Left: Clock & Weather Widgets -->
            <div class="flex items-center space-x-6">
                <!-- Clock -->
                <div class="flex items-baseline space-x-2">
                    <span id="clock-time" class="text-xl font-bold tracking-tight text-white">--:--</span>
                    <span id="clock-date" class="text-xs font-medium text-slate-400">Loading date...</span>
                </div>
                <!-- Divider -->
                <div class="h-5 w-[1px] bg-white/10 hidden sm:block"></div>
                <!-- Weather -->
                <div class="hidden sm:flex items-center space-x-2 text-sm text-slate-300">
                    <span id="weather-icon">⛅</span>
                    <span id="weather-temp" class="font-semibold text-white">--°F</span>
                    <span id="weather-desc" class="text-xs text-slate-400">Local Weather</span>
                </div>
            </div>

            <!-- Center/Right: Search Bar & Settings -->
            <div class="flex items-center space-x-3 flex-1 max-w-md mx-6">
                <div class="relative w-full">
                    <input type="text" id="search-input" 
                        class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-3.5 py-[6.5px] text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner"
                        placeholder="Filter bookmarks or press Enter to search Google...">
                </div>
            </div>

            <!-- Settings Gear Button -->
            <button id="settings-btn" class="p-2 text-slate-400 hover:text-white bg-slate-800/50 hover:bg-slate-800 border border-white/5 rounded-xl transition-all" title="Dashboard Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Bookmark Grid Area -->
    <main class="w-full max-w-7xl mx-auto flex-1 mb-2">
        <div id="bookmark-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-stretch">
            <!-- Dynamically populated columns -->
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-lg mx-4 p-5 shadow-2xl max-h-[92vh] flex flex-col overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
                <h2 class="text-lg font-bold text-white">Dashboard Settings</h2>
                <button id="close-settings" class="text-slate-400 hover:text-white p-1 rounded-lg">✕</button>
            </div>
            
            <div class="space-y-4 flex-1">
                <div>
                    <h3 class="text-sm font-semibold text-slate-300 mb-1">Import / Export Bookmarks (HTML)</h3>
                    <p class="text-xs text-slate-400 mb-2">Upload an exported bookmarks HTML file or add items manually below.</p>
                    <input type="file" id="import-file" accept=".html" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                </div>

                <hr class="border-white/10">

                <div>
                    <h3 class="text-sm font-semibold text-slate-300 mb-2">➕ Add Bookmark Manually</h3>
                    <div class="space-y-2.5">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Category / Column Name</label>
                            <input type="text" id="manual-cat" list="category-list" class="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="e.g. GOOGLE">
                            <datalist id="category-list"></datalist>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Bookmark Title</label>
                            <input type="text" id="manual-title" class="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="e.g. GitHub">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">URL</label>
                            <input type="url" id="manual-url" class="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="https://github.com">
                        </div>
                        <button id="save-manual-bookmark" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md">Add to Dashboard</button>
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t border-white/10 mt-4 flex justify-end">
                <button id="save-settings-btn" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-medium transition-all">Close</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Clock Update
        function updateClock() {
            try {
                const now = new Date();
                let hours = now.getHours();
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                document.getElementById('clock-time').textContent = `${hours}:${minutes} ${ampm}`;
                
                const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
                document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', options);
            } catch (err) {
                console.error("Clock error:", err);
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Default Bookmarks Data Structure
        const defaultBookmarks = {
            "GOOGLE": [
                { title: "Gmail", url: "https://mail.google.com" },
                { title: "Calendar", url: "https://calendar.google.com" },
                { title: "Drive", url: "https://drive.google.com" },
                { title: "Keep", url: "https://keep.google.com" }
            ],
            "MEDIA": [
                { title: "YouTube", url: "https://youtube.com" },
                { title: "Peacock", url: "https://www.peacocktv.com/watch/home" },
                { title: "Inoreader", url: "https://www.inoreader.com" }
            ],
            "SOCIAL": [
                { title: "Discord", url: "https://discord.com" },
                { title: "Reddit", url: "https://reddit.com" }
            ],
            "TOOLS": [
                { title: "GitHub", url: "https://github.com" },
                { title: "ChatGPT", url: "https://chat.openai.com" }
            ]
        };

        let bookmarkData = defaultBookmarks;
        try {
            const saved = localStorage.getItem('startpage_bookmarks');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                    bookmarkData = parsed;
                }
            }
        } catch (e) {
            console.warn("Could not load localStorage bookmarks, using defaults.", e);
        }

        function renderBookmarks(filterText = '') {
            try {
                const grid = document.getElementById('bookmark-grid');
                if (!grid) return;
                grid.innerHTML = '';
                
                const datalist = document.getElementById('category-list');
                if (datalist) datalist.innerHTML = '';

                Object.keys(bookmarkData).forEach(category => {
                    if (datalist) {
                        const opt = document.createElement('option');
                        opt.value = category;
                        datalist.appendChild(opt);
                    }

                    const links = bookmarkData[category] || [];
                    const filteredLinks = links.filter(l => 
                        (l.title && l.title.toLowerCase().includes(filterText.toLowerCase())) || 
                        (l.url && l.url.toLowerCase().includes(filterText.toLowerCase()))
                    );
                    
                    if (filterText && filteredLinks.length === 0) return;

                    const card = document.createElement('div');
                    card.className = "bg-slate-900/60 backdrop-blur-md border border-white/10 rounded-2xl pt-[13px] px-4 pb-[12px] flex flex-col h-full shadow-lg";

                    let linksHtml = filteredLinks.map(link => `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between px-3 py-2 rounded-xl text-sm text-slate-300 hover:text-white hover:bg-white/5 transition-all group">
                            <span class="truncate">${link.title}</span>
                            <span class="text-xs text-slate-500 group-hover:text-slate-400">↗</span>
                        </a>
                    `).join('');

                    card.innerHTML = `
                        <h3 class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2 px-3">${category}</h3>
                        <div class="space-y-0.5 flex-1">
                            ${linksHtml || '<p class="text-xs text-slate-500 px-3 py-2">No bookmarks</p>'}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Error rendering bookmarks:", err);
            }
        }

        renderBookmarks();

        // Search Filter & Enter to Google Search
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                renderBookmarks(e.target.value);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                    const query = searchInput.value.trim();
                    if (query.startsWith('http://') || query.startsWith('https://') || query.includes('.')) {
                        window.open(query.startsWith('http') ? query : `https://${query}`, '_blank', 'noopener,noreferrer');
                    } else {
                        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank', 'noopener,noreferrer');
                    }
                }
            });
        }

        // Settings Modal Controls
        const settingsModal = document.getElementById('settings-modal');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettings = document.getElementById('close-settings');
        const saveSettingsBtn = document.getElementById('save-settings-btn');

        if (settingsBtn && settingsModal) {
            settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        }
        if (closeSettings && settingsModal) {
            closeSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));
        }
        if (saveSettingsBtn && settingsModal) {
            saveSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
        }

        // Manual Bookmark Addition
        const saveManualBtn = document.getElementById('save-manual-bookmark');
        if (saveManualBtn) {
            saveManualBtn.addEventListener('click', () => {
                const catInput = document.getElementById('manual-cat');
                const titleInput = document.getElementById('manual-title');
                const urlInput = document.getElementById('manual-url');

                const cat = (catInput.value.trim() || 'GENERAL').toUpperCase();
                const title = titleInput.value.trim();
                const url = urlInput.value.trim();

                if (!title || !url) {
                    alert('Please provide both a title and a URL.');
                    return;
                }

                if (!bookmarkData[cat]) {
                    bookmarkData[cat] = [];
                }
                bookmarkData[cat].push({ title, url });
                localStorage.setItem('startpage_bookmarks', JSON.stringify(bookmarkData));

                titleInput.value = '';
                urlInput.value = '';
                renderBookmarks();
                alert('Bookmark added successfully!');
            });
        }

        // HTML Bookmark Import Parser
        const importFile = document.getElementById('import-file');
        if (importFile) {
            importFile.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const htmlContent = event.target.result;
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlContent, 'text/html');
                        const parsedData = {};

                        const h3s = doc.querySelectorAll('h3');
                        h3s.forEach(h3 => {
                            let sibling = h3.nextElementSibling;
                            let links = [];
                            
                            while (sibling && sibling.tagName !== 'H3') {
                                if (sibling.tagName === 'DL') {
                                    sibling.querySelectorAll('a').forEach(a => {
                                        links.push({ title: a.textContent.trim(), url: a.href });
                                    });
                                }
                                sibling = sibling.nextElementSibling;
                            }
                            if (links.length > 0) {
                                parsedData[h3.textContent.trim().toUpperCase()] = links;
                            }
                        });

                        if (Object.keys(parsedData).length > 0) {
                            bookmarkData = parsedData;
                            localStorage.setItem('startpage_bookmarks', JSON.stringify(bookmarkData));
                            renderBookmarks();
                            alert('Bookmarks imported successfully!');
                        } else {
                            alert('Could not parse bookmark folders from this HTML file.');
                        }
                    } catch (parseErr) {
                        console.error("Parse error:", parseErr);
                        alert('Error parsing the bookmark file.');
                    }
                };
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
