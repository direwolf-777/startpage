<!DOCTYPE html>
<html lang="en" class="dark" data-theme="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Bookmark Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root[data-theme="indigo"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 45%, #070913 100%);
      --card-bg: rgba(15, 23, 42, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
    }
    :root[data-theme="slate"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #334155 0%, #1e293b 50%, #090d16 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
    }
    :root[data-theme="oled"] {
      --bg-gradient: #000000;
      --card-bg: rgba(10, 10, 10, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #a855f7;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: #f8fafc;
      background: var(--bg-gradient);
      background-attachment: fixed;
      transition: background 0.3s ease;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 0 8px 24px -8px rgba(99, 102, 241, 0.15);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
    }

    /* Fixed 138px width for side controls */
    .ctrl-btn {
      width: 138px;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6366f1;
    }
  </style>
</head>
<body class="p-3 sm:p-4 md:p-6">

  <div class="max-w-7xl mx-auto space-y-3 sm:space-y-4">
    
    <!-- Header / Top Bar with Integrated Center Search -->
    <header class="glass-card rounded-xl p-3 sm:p-4 flex flex-col md:flex-row items-center justify-between gap-3 shadow-xl">
      <!-- Left: Clock, Date & Weather -->
      <div class="flex flex-col sm:flex-row items-center sm:items-start md:items-center gap-3 text-center sm:text-left flex-shrink-0">
        <div>
          <div id="clock" class="text-2xl sm:text-3xl font-extralight tracking-tight font-mono text-white">00:00 PM</div>
          <div id="date" class="text-[11px] sm:text-xs text-slate-400 font-medium mt-0.5">Loading date...</div>
        </div>
        <div class="h-9 w-[1px] bg-white/10 hidden sm:block"></div>
        <!-- Local Weather Widget -->
        <div id="weather-widget" class="flex items-center gap-2.5 text-slate-300 bg-slate-900/40 px-3 py-1.5 rounded-xl border border-white/5 shadow-inner">
          <span id="weather-icon" class="text-xl sm:text-2xl">🌤️</span>
          <div>
            <div id="weather-temp" class="font-semibold text-sm sm:text-base text-white">--°F</div>
            <div id="weather-desc" class="text-[10px] sm:text-xs text-slate-400 leading-tight">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Center: Integrated Inline Search Bar -->
      <div class="w-full md:flex-1 md:max-w-xl md:mx-2">
        <div class="glass-input flex items-center rounded-xl px-3 py-2 shadow-inner">
          <svg class="w-4 h-4 text-slate-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input 
            type="text" 
            id="search-input" 
            class="w-full bg-transparent border-none text-white focus:outline-none text-xs sm:text-sm placeholder-slate-500" 
            placeholder="Filter bookmarks or press Enter to search Google..." 
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Right Stacked Actions (Fixed 138px controls) -->
      <div class="flex flex-col gap-1.5 w-full sm:w-auto items-stretch sm:items-end flex-shrink-0">
        <select id="theme-selector" class="ctrl-btn bg-slate-900/80 border border-white/10 text-xs text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 cursor-pointer shadow-sm text-center sm:text-left">
          <option value="indigo">Theme: Indigo</option>
          <option value="slate">Theme: Slate</option>
          <option value="oled">Theme: OLED</option>
        </select>

        <label for="file-input" class="ctrl-btn text-center cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg transition-all shadow-md whitespace-nowrap">
          📁 Import HTML
        </label>
        <input type="file" id="file-input" accept=".html" class="hidden" />

        <button id="clear-btn" class="ctrl-btn bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg transition-all text-center">
          Clear Data
        </button>
      </div>
    </header>

    <!-- Bookmarks Grid -->
    <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5" id="bookmark-grid">
      <!-- Populated dynamically via JS or empty state -->
    </main>

  </div>

  <script>
    // --- Clock & Date ---
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // --- Weather Widget (Open-Meteo API) ---
    function getWeatherIcon(code) {
      if (code === 0) return '☀️';
      if (code >= 1 && code <= 3) return '🌤️';
      if (code >= 45 && code <= 48) return '🌫️';
      if (code >= 51 && code <= 67) return '🌧️';
      if (code >= 71 && code <= 77) return '❄️';
      if (code >= 80 && code <= 82) return '🌦️';
      if (code >= 95) return '🌩️';
      return '🌡️';
    }

    function getWeatherDescription(code) {
      if (code === 0) return 'Clear Sky';
      if (code === 1) return 'Mainly Clear';
      if (code === 2) return 'Partly Cloudy';
      if (code === 3) return 'Overcast';
      if (code >= 45 && code <= 48) return 'Foggy';
      if (code >= 51 && code <= 55) return 'Drizzle';
      if (code >= 61 && code <= 65) return 'Rain';
      if (code >= 71 && code <= 75) return 'Snow';
      if (code >= 95) return 'Thunderstorm';
      return 'Local Weather';
    }

    async function fetchWeather(lat, lon) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit`);
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const code = data.current_weather.weathercode;
          document.getElementById('weather-temp').textContent = `${temp}°F`;
          document.getElementById('weather-desc').textContent = getWeatherDescription(code);
          document.getElementById('weather-icon').textContent = getWeatherIcon(code);
        }
      } catch (err) {
        document.getElementById('weather-desc').textContent = 'Unavailable';
      }
    }

    function initWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
          () => {
            fetchWeather(40.7128, -74.0060);
            document.getElementById('weather-desc').textContent = 'Default Location';
          }
        );
      } else {
        fetchWeather(40.7128, -74.0060);
      }
    }
    initWeather();

    // --- Theme Switcher ---
    const themeSelector = document.getElementById('theme-selector');
    const savedTheme = localStorage.getItem('dashboard_theme') || 'indigo';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelector.value = savedTheme;

    themeSelector.addEventListener('change', (e) => {
      const selected = e.target.value;
      document.documentElement.setAttribute('data-theme', selected);
      localStorage.setItem('dashboard_theme', selected);
    });

    // --- Bookmark State & Storage ---
    let bookmarkData = JSON.parse(localStorage.getItem('user_bookmarks_dashboard')) || {};

    function saveToStorage() {
      localStorage.setItem('user_bookmarks_dashboard', JSON.stringify(bookmarkData));
    }

    function renderBookmarks(filter = '') {
      const grid = document.getElementById('bookmark-grid');
      grid.innerHTML = '';

      const categories = Object.keys(bookmarkData);
      if (categories.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 glass-card rounded-xl p-6 text-slate-400">
            <h3 class="text-base font-semibold text-white mb-1">No Bookmarks Loaded Yet</h3>
            <p class="text-xs">Click <strong class="text-indigo-400">📁 Import HTML</strong> at the top right to select your Netscape bookmark file.</p>
          </div>
        `;
        return;
      }

      let totalMatches = 0;

      categories.forEach(catName => {
        const links = bookmarkData[catName].filter(item => 
          item.name.toLowerCase().includes(filter.toLowerCase()) || 
          item.url.toLowerCase().includes(filter.toLowerCase())
        );

        if (links.length > 0) {
          totalMatches += links.length;
          const card = document.createElement('section');
          card.className = 'glass-card rounded-xl p-3.5 space-y-2.5';

          const linksHTML = links.map(link => `
            <li>
              <a href="${link.url}" target="_blank" rel="noopener" class="flex items-center gap-2 px-2 py-1.5 rounded-lg text-xs text-slate-300 hover:bg-slate-800/80 hover:text-white hover:translate-x-1 transition-all truncate">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400/60 flex-shrink-0"></span>
                <span class="truncate">${link.name}</span>
              </a>
            </li>
          `).join('');

          card.innerHTML = `
            <div class="flex items-center justify-between pb-2 border-b border-white/5">
              <h3 class="text-[11px] font-bold uppercase tracking-widest text-indigo-400">${catName}</h3>
              <span class="text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-1.5 py-0.5 rounded font-mono">${links.length}</span>
            </div>
            <ul class="space-y-0.5 max-h-72 overflow-y-auto pr-1">
              ${linksHTML}
            </ul>
          `;

          grid.appendChild(card);
        }
      });

      if (totalMatches === 0 && filter !== '') {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10 glass-card rounded-xl p-6 text-slate-400">
            <h3 class="text-sm font-medium text-white mb-1">No matching bookmarks found</h3>
            <p class="text-xs">Press Enter to search Google for "<strong class="text-indigo-300">${filter}</strong>"</p>
          </div>
        `;
      }
    }

    // --- Netscape HTML Importer ---
    function parseBookmarkHTML(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const parsedData = {};

      const headers = doc.querySelectorAll('h3');
      headers.forEach(h3 => {
        const title = h3.textContent.trim().toUpperCase();
        const parentDl = h3.nextElementSibling;
        if (parentDl && parentDl.tagName === 'DL') {
          const anchors = parentDl.querySelectorAll('a');
          if (anchors.length > 0) {
            if (!parsedData[title]) parsedData[title] = [];
            anchors.forEach(a => {
              parsedData[title].push({
                name: a.textContent.trim(),
                url: a.getAttribute('href')
              });
            });
          }
        }
      });
      return parsedData;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const content = event.target.result;
        const parsed = parseBookmarkHTML(content);
        if (Object.keys(parsed).length > 0) {
          bookmarkData = parsed;
          saveToStorage();
          renderBookmarks();
        } else {
          alert("Could not detect standard Netscape bookmark folders. Please check file format.");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      localStorage.removeItem('user_bookmarks_dashboard');
      bookmarkData = {};
      renderBookmarks();
    });

    // --- Search & Filter / Google Search ---
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e) => {
      renderBookmarks(e.target.value);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (!query) return;
        if (/^https?:\/\//i.test(query)) {
          window.open(query, '_blank', 'noopener');
        } else {
          window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank', 'noopener');
        }
      }
    });

    // Initial Render
    renderBookmarks();
  </script>
</body>
</html>
